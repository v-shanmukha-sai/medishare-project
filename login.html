<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MedShare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-bg">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
          <a href="index.html" class="text-white text-decoration-none"><h3 class="fw-bold"><i class="bi bi-heart-pulse-fill"></i> MedShare</h3></a>
          <p class="text-white-50 small">Sign in to your account</p>
        </div>
        <div class="card shadow">
          <div class="card-body p-4">
            <div id="alertBox"></div>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
              </div>
              <button class="btn btn-primary w-100" type="submit">Login</button>
            </form>
            <hr>
            <div class="mb-3">
              <label class="form-label small text-secondary">Demo quick login</label>
              <div class="d-grid gap-2">
                <button class="btn btn-outline-primary btn-sm" data-role="admin">Login as Admin</button>
                <button class="btn btn-outline-success btn-sm" data-role="distributor">Login as Distributor</button>
                <button class="btn btn-outline-info btn-sm" data-role="ngo">Login as NGO</button>
              </div>
            </div>
            <p class="text-center small mb-0">New here? <a href="register.html">Create an account</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
