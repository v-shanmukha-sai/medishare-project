<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MedShare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-bg">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
          <a href="index.html" class="text-white text-decoration-none"><h3 class="fw-bold"><i class="bi bi-heart-pulse-fill"></i> MedShare</h3></a>
          <p class="text-white-50 small">Create an account - verification by admin required</p>
        </div>
        <div class="card shadow">
          <div class="card-body p-4">
            <div id="alertBox"></div>
            <form id="registerForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Account Type *</label>
                <div class="row g-2">
                  <div class="col-6">
                    <input type="radio" class="btn-check" name="role" id="r-dist" value="Distributor" checked>
                    <label class="btn btn-outline-primary w-100" for="r-dist"><i class="bi bi-truck"></i> Distributor</label>
                  </div>
                  <div class="col-6">
                    <input type="radio" class="btn-check" name="role" id="r-ngo" value="NGO">
                    <label class="btn btn-outline-success w-100" for="r-ngo"><i class="bi bi-buildings"></i> Organization</label>
                  </div>
                </div>
                <select class="form-select mt-2 d-none" id="orgType">
                  <option value="NGO">NGO</option>
                  <option value="Old-Age Home">Old-Age Home</option>
                  <option value="Orphanage">Orphanage</option>
                  <option value="Charitable Hospital">Charitable Hospital</option>
                  <option value="Medical Shop">Medical Shop</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Full Name / Organization Name *</label>
                <input type="text" class="form-control" id="fullname" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email *</label>
                <input type="email" class="form-control" id="email" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-control" id="phone">
              </div>
              <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea class="form-control" id="address" rows="2"></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Password *</label>
                <input type="password" class="form-control" id="password" minlength="6" required>
              </div>
              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="agree" required>
                <label class="form-check-label small" for="agree">I agree to the terms and verification process</label>
              </div>
              <button class="btn btn-primary w-100" type="submit">Register</button>
            </form>
            <p class="text-center small mt-3 mb-0">Already registered? <a href="login.html">Login</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
