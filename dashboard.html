<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - MedShare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex">
    <aside class="sidebar bg-dark text-white d-none d-md-flex flex-column p-3" id="sidebar">
      <a href="index.html" class="navbar-brand fw-bold text-white mb-4"><i class="bi bi-heart-pulse-fill"></i> MedShare</a>
      <nav class="nav flex-column" id="sideNav">
        <a class="nav-link text-white" data-page="overview"><i class="bi bi-speedometer2"></i> Overview</a>
        <a class="nav-link text-white" data-page="medicines"><i class="bi bi-capsule"></i> Medicines</a>
        <a class="nav-link text-white" data-page="orders"><i class="bi bi-cart"></i> Orders</a>
        <a class="nav-link text-white" data-page="notifications"><i class="bi bi-bell"></i> Notifications <span class="badge bg-danger ms-1" id="notifCount">0</span></a>
        <a class="nav-link text-white" data-page="reports"><i class="bi bi-clipboard-data"></i> Reports</a>
        <a class="nav-link text-white" data-page="audit"><i class="bi bi-journal-check"></i> Audit Logs</a>
        <a class="nav-link text-white" data-page="verify"><i class="bi bi-patch-check"></i> Verification</a>
      </nav>
      <hr class="text-secondary">
      <div class="mt-auto small">
        <div class="fw-bold" id="userName">User</div>
        <div class="text-secondary" id="userRole">-</div>
        <a href="index.html" class="btn btn-sm btn-outline-light mt-2 w-100"><i class="bi bi-box-arrow-right"></i> Logout</a>
      </div>
    </aside>

    <main class="flex-grow-1">
      <nav class="navbar navbar-dark bg-primary d-md-none sticky-top">
        <div class="container-fluid">
          <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-heart-pulse-fill"></i> MedShare</a>
          <div class="dropdown">
            <button class="btn btn-light btn-sm dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-person"></i> <span id="userNameM">User</span></button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><button class="dropdown-item" data-page="overview">Overview</button></li>
              <li><button class="dropdown-item" data-page="medicines">Medicines</button></li>
              <li><button class="dropdown-item" data-page="orders">Orders</button></li>
              <li><button class="dropdown-item" data-page="notifications">Notifications</button></li>
              <li><button class="dropdown-item" data-page="reports">Reports</button></li>
              <li><button class="dropdown-item" data-page="audit">Audit Logs</button></li>
              <li><button class="dropdown-item" data-page="verify">Verification</button></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="index.html">Logout</a></li>
            </ul>
          </div>
        </div>
      </nav>

      <div class="container-fluid p-4" id="pageArea">
        <div id="pageTitle" class="h4 mb-4">Overview</div>
        <div id="pageContent"><!-- JS renders here --></div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Place Order</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="orderModalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
